<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YVP Clipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>YVP Clipper</h1>
      <p class="hint">YouTube → desktop app · авто-запуск через yvp://</p>
    </header>

    <div id="page-error" class="banner error hidden"></div>
    <div id="host-error" class="banner warn hidden"></div>
    <div id="install-panel" class="banner info hidden">
      <p id="install-text">Приложение не установлено или не отвечает.</p>
      <div class="install-actions">
        <a id="link-releases" class="link-btn" href="#" target="_blank" rel="noopener">Скачать с GitHub</a>
        <button type="button" id="btn-retry-app" class="secondary">Установил — повторить</button>
      </div>
      <p class="install-hint">Скачай <strong>YVPClipper-Setup.exe</strong> с Releases — установщик сам пропишет <strong>yvp://</strong>.</p>
    </div>

    <form id="clip-form">
      <label>
        <span>Начало отрезка</span>
        <input id="start" name="start" type="text" placeholder="1:30.250 или 90.5" required />
        <button type="button" id="btn-refresh-start" class="secondary" title="Взять текущее время с плеера">
          ↻ с плеера
        </button>
      </label>

      <label>
        <span>Конец отрезка</span>
        <input id="end" name="end" type="text" placeholder="3:45.750 или 225.5" required />
      </label>

      <div class="plus-row">
        <label class="plus-field">
          <span>+ секунд от начала</span>
          <input id="plus-seconds" type="number" min="1" max="86400" value="10" />
        </label>
        <button type="button" id="btn-calc-end" class="secondary">→ конец</button>
      </div>

      <label>
        <span>Название файла</span>
        <input id="title" name="title" type="text" placeholder="мой_клип" required />
      </label>

      <button type="submit" id="btn-download" class="primary">Скачать отрезок</button>
    </form>

    <section class="log-panel">
      <div class="log-header">
        <span>Лог</span>
        <span id="status">Готов</span>
      </div>
      <pre id="log"></pre>
    </section>

    <footer class="license">
      GNU GPL v3 · copyleft · форки только под GPL
    </footer>

    <script src="time.js"></script>
    <script src="clip-bridge.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
