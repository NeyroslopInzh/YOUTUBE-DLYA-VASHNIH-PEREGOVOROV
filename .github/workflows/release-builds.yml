name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt -r windows/requirements.txt -r windows/requirements-build.txt
          pip install Pillow

      - name: Prepare assets
        run: |
          python scripts/sync_extension_manifest.py
          python scripts/generate_app_icon.py
          python extension/icons/generate_icons.py
          python scripts/generate_uzbek_isl.py

      - name: Build portable exe
        run: python -m PyInstaller windows/app.spec --noconfirm --distpath dist/windows --workpath build/windows

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer.iss'

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/windows/YOUTUBE VIDEOS DOWNLOAD FOR VASHNIE PEREGOVORI 2002 KRUTO COOL SOSAL.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/windows/YVPClipper-Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-tk python3-venv ffmpeg rsync zip

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r src/requirements.txt -r linux/requirements.txt -r linux/requirements-build.txt
          pip install Pillow

      - name: Prepare assets
        run: |
          python3 scripts/sync_extension_manifest.py
          python3 extension/icons/generate_icons.py

      - name: Build portable binary
        run: python3 -m PyInstaller linux/app.spec --noconfirm --distpath dist/linux --workpath build/linux

      - name: Build Linux installer tarball
        run: bash linux/build-installer.sh

      - name: Upload portable binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: dist/linux/

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/YVPClipper-linux-installer.tar.gz

  package-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip rsync
          python -m pip install --upgrade pip Pillow

      - name: Pack extension archives
        run: bash scripts/package_extension.sh

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/YVPClipper-extension.zip

      - name: Upload extension tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: extension-tarball
          path: dist/YVPClipper-extension.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, package-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-portable/*
            artifacts/windows-installer/*
            artifacts/linux-portable/*
            artifacts/linux-installer/*
            artifacts/extension-zip/*
            artifacts/extension-tarball/*
          generate_release_notes: true
