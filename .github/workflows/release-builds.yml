name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt -r windows/requirements.txt -r windows/requirements-build.txt

      - name: Build
        run: python -m PyInstaller windows/app.spec --noconfirm --distpath dist/windows --workpath build/windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/windows/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-tk python3-venv ffmpeg

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r src/requirements.txt -r linux/requirements.txt -r linux/requirements-build.txt

      - name: Build
        run: python3 -m PyInstaller linux/app.spec --noconfirm --distpath dist/linux --workpath build/linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/linux/
