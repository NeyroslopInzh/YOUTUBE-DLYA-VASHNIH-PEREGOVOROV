name: Build Arch Linux binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest

    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git python python-pip tk

      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build binary
        run: python -m PyInstaller app.spec --noconfirm

      - name: Stage release artifact
        run: |
          APP_NAME="YOUTUBE VIDEOS DOWNLOAD FOR VASHNIE PEREGOVORI 2002 KRUTO COOL SOSAL"
          mkdir -p release/arch-linux
          cp -f "dist/${APP_NAME}" "release/arch-linux/${APP_NAME}"
          chmod +x "release/arch-linux/${APP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-linux-binary
          path: release/arch-linux/
